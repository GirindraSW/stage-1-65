<html>

<head>
    <title>Input Project</title>
    <link rel="stylesheet" href="assets\css\style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--Bootstrap-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <!--Font Awesome-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-warning">
        <div class="container-fluid">
            <a class="navbar-brand" href="Index.html"><img src="assets/images/brandwhite.png" alt="DumbWays.ID"
                    width="30" height="24"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="Index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="my_project.html">My Project</a>
                    </li>
                </ul>
                <a href="contact.html" class="btn btn-outline-success" type="submit">Contact Me</a>
            </div>
        </div>
    </nav>

    <div class="add-project container-fluid bg-light">
        <div class="add-project p-5"> <!--add project form-->
            <H4 class="text-center fw-bolder">ADD MY PROJECT</H4><br>
            <div class="row justify-content-center">
                <div class="col-md-4">
    
                    <p id="header-user">please insert your project details</p>
                    <form id="biodata">
                        <div class="row mb-3"> <!--Project Name-->
                            <label class="form-label ps-0 mb-0" for="fname">Project Name</label>
                            <input class="form-control shadow-sm border-1" type="text" id="fname" name="fname">
                        </div>
                        <div class="row mb-3"> <!-- Project Date -->
                            <div class="col-6 ps-0">
                                <label for="#">Start Date</label>
                                <input class="form-control shadow-sm" type="text" id="#" name="#">
                            </div>
                            <div class="col-6 pe-0">
                                <label for="#">End Date</label>
                                <input class="form-control shadow-sm" type="text" id="#" name="#">
                            </div>
                        </div>
                        <div class="row mb-3"> <!-- Project Description -->
                            <label class="ps-0" for="lname">Description</label>
                            <textarea class="form-control shadow-sm" type="text" id="lname" name="lname"
                                rows="4"></textarea>
                        </div>
                        <div class="row mb-3"> <!--Technologies-->
                            <div class="row mb-2">
                                Technologies
                            </div>
                            <div class="row">
                                <div class="col ps-0">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                                        <label class="form-check-label" for="checkDefault">
                                            Node Js
                                        </label>
                                    </div>
                                </div>
                                <div class="col">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                                        <label class="form-check-label" for="checkDefault">
                                            Next Js
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col ps-0">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                                        <label class="form-check-label" for="checkDefault">
                                            React Js
                                        </label>
                                    </div>
                                </div>
                                <div class="col">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                                        <label class="form-check-label" for="checkDefault">
                                            TypeScript
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-4"> <!--Upload Image-->
                                <label for="input-image" class="form-label ps-0 mb-0">Upload Image</label>
                                <div class="input-group custom-upload shadow-sm px-0">
                                    <label class="input-group-text bg-secondary-subtle text-secondary"
                                        for="input-image">choose</label>
                                    <input type="file" class="form-control d-none" id="input-image">
                                    <div
                                        class=" form-control bg-white text-secondary d-flex justify-content-end align-items-center p">
                                        <i class="fa-solid fa-paperclip"></i>
                                    </div>
                                </div>
                        </div>
                        <div class="row"> <!--Submit button-->
                            <div class="col-auto ms-auto pe-0">
                                <button type="submit" class="btn btn-dark btn-sm rounded-pill px-4">submit</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>    
    </div>
    
    <div class="container-fluid">
        <div class="row">
            <h3 class="text-center my-5 fw-bolder">My Project</h3>

            <div id="userList" class="row g-3 mt-2">
                <!-- card akan muncul di sini -->
            </div>
        </div>
    </div>
</body>

<script src="assets\scripts\my_project.js"></script>

</html>
