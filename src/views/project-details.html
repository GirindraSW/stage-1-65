<html>

<head>
    <title>Input Project</title>
    <link rel="stylesheet" href="assets\css\style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--Bootstrap-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <!--Font Awesome-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <!--DETAIL CONTENT-->
    <div class="container mt-5">
        <h1 id="projectTitle" class="project-title">Loading ...</h1>
    
        <div class="row g-4">
            <!--IMAGE-->
            <div class="col-lg-7">
                <img id="projectImage" src="" class="img-fluid rounded shadow"
                    style="width: 100%; height: 350px; object-fit: cover" />
            </div>
    
            <!--RIGHT SIDE INFO-->
            <div class="col-lg-5">
                <h4 class="fw-bold mb-3">Duration</h4>
    
                <p id="projectDate" class="mb-1">
                    <i class="fa-regular fa-calendar-days me-2"></i>
                    Loading ...
                </p>
    
                <p id="projectDuration">
                    <i class="fa-solid fa-hourglass-half me-2"></i>
                    Loading ...
                </p>
    
                <h4 class="fw-bold mt-4 mb-3">Technologies</h4>
    
                <div id="techList" class="tech-list"></div>
            </div>
        </div>
    
        <!--DESCRIPTION-->
        <div class="mt-5">
            <h3 class="fw-bold">Description</h3>
            <p id="projectDescription" class="project-description">Loading ...</p>
        </div>
    </div>

    <script src="assets\scripts\project-details.js"></script>
</body>

</html>
